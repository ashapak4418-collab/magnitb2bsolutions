<div class="onboarding-section" style="padding: 20px; background: #f9f9f9; border-radius: 8px; margin: 20px 0;">
    <h3>🤝 Partner & Vendor Onboarding Form</h3>
    <form id="onboardingForm">
        <label>Business / Partner Name:</label><br>
        <input type="text" id="partnerName" placeholder="Enter business name" required style="width: 100%; padding: 8px; margin: 5px 0 15px 0;"><br>

        <label>Select Category:</label><br>
        <select id="partnerCategory" style="width: 100%; padding: 8px; margin: 5px 0 15px 0;">
            <option>FMCG Distributor / Stockist</option>
            <option>Facility Management Vendor</option>
            <option>Solar / Renewable Energy Partner</option>
        </select><br>

        <label>Contact Number:</label><br>
        <input type="tel" id="partnerContact" placeholder="Mobile / WhatsApp number" required style="width: 100%; padding: 8px; margin: 5px 0 15px 0;"><br>

        <button type="submit" style="background: #28a745; color: white; padding: 10px 20px; border: none; border-radius: 5px; cursor: pointer;">Register Partner</button>
    </form>
</div>
